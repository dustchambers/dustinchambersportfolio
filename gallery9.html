<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Dustin Chambers Photography</title>
  <link rel="stylesheet" href="gallery9.css?v=2">
</head>
<body>
  <div class="gallery" id="gallery"></div>
  <script>
    // Loads galleries/<id>.js for the ?id= in the URL before gallery9.js
    // runs, so each gallery only ever needs an images folder + one config
    // file — no dedicated HTML page per gallery.
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      function addScript(src) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false; // preserve execution order across dynamic scripts
        document.head.appendChild(s);
      }
      if (id) addScript("galleries/" + encodeURIComponent(id) + ".js?v=1");
      addScript("gallery9.js?v=3");
    })();
  </script>
</body>
</html>
